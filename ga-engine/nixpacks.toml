# nixpacks.toml — Railway GA Engine (Python/FastAPI)
# Lido quando Root Directory = /ga-engine e builder = Nixpacks/Railpack

[phases.setup]
nixPkgs = ["python311", "gcc", "libffi"]

[phases.install]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1"
