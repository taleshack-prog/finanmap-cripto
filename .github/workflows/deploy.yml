name: CI/CD - FinanMap Cripto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm run build
      - run: npm test --if-present

  test-ga-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ga-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run TDD v1.0 smoke tests
        run: pytest tests/ -v

  build-docker:
    needs: [test-backend, test-ga-engine]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: docker-compose build
      - run: echo "✅ Build Docker bem-sucedido"

  deploy-railway-ga:
    name: Deploy GA Engine → Railway
    needs: [test-ga-engine]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ga-engine
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service ga-engine \
            --detach \
            --ci \
            --dir ga-engine

      - name: Healthcheck após deploy
        env:
          GA_ENGINE_URL: ${{ secrets.GA_ENGINE_URL }}
        run: |
          echo "Aguardando deploy estabilizar (30s)..."
          sleep 30
          STATUS=$(curl -sf "${GA_ENGINE_URL}/status" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'))" 2>/dev/null || echo "unreachable")
          echo "Status: $STATUS"
          if [ "$STATUS" != "GA Engine OK" ]; then
            echo "⚠️  Healthcheck retornou: $STATUS (pode ainda estar iniciando)"
          else
            echo "✅ GA Engine online"
          fi
