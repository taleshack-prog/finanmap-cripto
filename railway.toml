# railway.toml — raiz do monorepo (serviço backend)
# O Railway usa este arquivo quando Root Directory não está configurado.
# Define o builder e aponta os comandos para /backend.
# Para o serviço ga-engine, configure Root Directory = ga-engine no painel.

[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm install && npm run build && npx prisma generate"

[deploy]
startCommand = "cd backend && npx prisma migrate deploy && npm start"
healthcheckPath = "/api/status"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
