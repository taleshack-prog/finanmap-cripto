# railway.toml — raiz do monorepo
# Usa o Dockerfile do backend explicitamente, evitando auto-detecção do Railpack

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/status"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
