# railway.toml — raiz do monorepo
# Root Directory no Railway UI deve ser '/' (raiz) para este Dockerfile funcionar
# Se Root Directory = '/backend', use dockerfilePath = "backend/Dockerfile"

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/api/status"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
